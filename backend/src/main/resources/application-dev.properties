# Local development profile (active by default).
# Optionally load local secrets from backend/.env (gitignored). See .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/conflux}

conflux.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.com.conflux=DEBUG
