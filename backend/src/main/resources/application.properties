# Shared configuration for all profiles.
# Credentials and environment-specific values are supplied via environment variables.
spring.application.name=conflux-backend
# Used only when no profile is explicitly activated (e.g. SPRING_PROFILES_ACTIVE=prod).
spring.profiles.default=dev

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
# The schema is owned by Flyway (src/main/resources/db/migration). Hibernate must never create or alter tables.
spring.jpa.hibernate.ddl-auto=none
# Read and write timestamps in UTC regardless of the JVM or database server time zone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Bind Instant as a plain TIMESTAMP so the UTC setting above applies to it; otherwise
# Hibernate stores Instants in DATETIME columns as JVM-local wall-clock time.
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Users authenticate with JWTs issued by /api/v1/auth/login: never create Spring Boot's default in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# JWT access tokens (HS256). JWT_SECRET is a Base64-encoded random key of at least 32 bytes;
# it has no default on purpose, so the application does not start without one.
conflux.jwt.secret=${JWT_SECRET}
conflux.jwt.issuer=${JWT_ISSUER:conflux}
conflux.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:1h}
