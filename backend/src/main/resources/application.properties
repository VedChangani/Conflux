spring.config.import=optional:file:.env[.properties]
spring.application.name=conflux-backend
spring.profiles.default=dev

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

conflux.jwt.secret=${JWT_SECRET}
conflux.jwt.issuer=${JWT_ISSUER:conflux}
conflux.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:1h}

conflux.rate-limit.max-tracked-keys=${RATE_LIMIT_MAX_TRACKED_KEYS:100000}
conflux.rate-limit.login.max-requests=${RATE_LIMIT_LOGIN_MAX_REQUESTS:10}
conflux.rate-limit.login.window=${RATE_LIMIT_LOGIN_WINDOW:1m}
conflux.rate-limit.register.max-requests=${RATE_LIMIT_REGISTER_MAX_REQUESTS:5}
conflux.rate-limit.register.window=${RATE_LIMIT_REGISTER_WINDOW:15m}
conflux.rate-limit.listing-create.max-requests=${RATE_LIMIT_LISTING_CREATE_MAX_REQUESTS:10}
conflux.rate-limit.listing-create.window=${RATE_LIMIT_LISTING_CREATE_WINDOW:1h}
conflux.rate-limit.listing-publish.max-requests=${RATE_LIMIT_LISTING_PUBLISH_MAX_REQUESTS:20}
conflux.rate-limit.listing-publish.window=${RATE_LIMIT_LISTING_PUBLISH_WINDOW:1h}
conflux.rate-limit.listing-save.max-requests=${RATE_LIMIT_LISTING_SAVE_MAX_REQUESTS:60}
conflux.rate-limit.listing-save.window=${RATE_LIMIT_LISTING_SAVE_WINDOW:1m}
conflux.rate-limit.listing-interest.max-requests=${RATE_LIMIT_LISTING_INTEREST_MAX_REQUESTS:20}
conflux.rate-limit.listing-interest.window=${RATE_LIMIT_LISTING_INTEREST_WINDOW:1h}
conflux.rate-limit.message-send.max-requests=${RATE_LIMIT_MESSAGE_SEND_MAX_REQUESTS:30}
conflux.rate-limit.message-send.window=${RATE_LIMIT_MESSAGE_SEND_WINDOW:1m}
conflux.rate-limit.report-create.max-requests=${RATE_LIMIT_REPORT_CREATE_MAX_REQUESTS:10}
conflux.rate-limit.report-create.window=${RATE_LIMIT_REPORT_CREATE_WINDOW:1h}
conflux.rate-limit.listing-update.max-requests=${RATE_LIMIT_LISTING_UPDATE_MAX_REQUESTS:30}
conflux.rate-limit.listing-update.window=${RATE_LIMIT_LISTING_UPDATE_WINDOW:1h}
conflux.rate-limit.listing-archive.max-requests=${RATE_LIMIT_LISTING_ARCHIVE_MAX_REQUESTS:10}
conflux.rate-limit.listing-archive.window=${RATE_LIMIT_LISTING_ARCHIVE_WINDOW:1h}
conflux.rate-limit.listing-unsave.max-requests=${RATE_LIMIT_LISTING_UNSAVE_MAX_REQUESTS:60}
conflux.rate-limit.listing-unsave.window=${RATE_LIMIT_LISTING_UNSAVE_WINDOW:1m}
conflux.rate-limit.connection-decision.max-requests=${RATE_LIMIT_CONNECTION_DECISION_MAX_REQUESTS:60}
conflux.rate-limit.connection-decision.window=${RATE_LIMIT_CONNECTION_DECISION_WINDOW:1h}
conflux.rate-limit.connection-withdraw.max-requests=${RATE_LIMIT_CONNECTION_WITHDRAW_MAX_REQUESTS:20}
conflux.rate-limit.connection-withdraw.window=${RATE_LIMIT_CONNECTION_WITHDRAW_WINDOW:1h}
conflux.rate-limit.profile-update.max-requests=${RATE_LIMIT_PROFILE_UPDATE_MAX_REQUESTS:20}
conflux.rate-limit.profile-update.window=${RATE_LIMIT_PROFILE_UPDATE_WINDOW:1h}
conflux.rate-limit.admin-moderation.max-requests=${RATE_LIMIT_ADMIN_MODERATION_MAX_REQUESTS:120}
conflux.rate-limit.admin-moderation.window=${RATE_LIMIT_ADMIN_MODERATION_WINDOW:1h}
server.forward-headers-strategy=none

