# Test profile: in-memory H2 (MySQL compatibility mode), no local MySQL required.
# Flyway applies the real migrations from src/main/resources/db/migration to this database.
spring.datasource.url=jdbc:h2:mem:conflux;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Tests only: verify the JPA mappings against the Flyway-created schema (validation never modifies it).
spring.jpa.hibernate.ddl-auto=validate

conflux.cors.allowed-origins=http://localhost:5173
