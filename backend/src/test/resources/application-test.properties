# Test profile: in-memory H2 (MySQL compatibility mode), no local MySQL required.
# Flyway applies the real migrations from src/main/resources/db/migration to this database.
spring.datasource.url=jdbc:h2:mem:conflux;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Tests only: verify the JPA mappings against the Flyway-created schema (validation never modifies it).
spring.jpa.hibernate.ddl-auto=validate

conflux.cors.allowed-origins=http://localhost:5173

# TEST-ONLY signing key (random, used nowhere else). Never reuse it for any real environment.
conflux.jwt.secret=h4lNo7g7e/y8GBeBz621+p9h30ektQp8kumLXj/JbilhvMWNBHUXUyXVHpucJGtY
conflux.jwt.issuer=conflux-test
conflux.jwt.access-token-ttl=15m

# Limits high enough that no functional test is throttled (all tests share one limiter per
# application context); RateLimitIntegrationTest sets its own low limits.
conflux.rate-limit.login.max-requests=1000000
conflux.rate-limit.register.max-requests=1000000
conflux.rate-limit.listing-create.max-requests=1000000
conflux.rate-limit.listing-publish.max-requests=1000000
conflux.rate-limit.listing-save.max-requests=1000000
conflux.rate-limit.listing-interest.max-requests=1000000
conflux.rate-limit.message-send.max-requests=1000000
conflux.rate-limit.report-create.max-requests=1000000
conflux.rate-limit.listing-update.max-requests=1000000
conflux.rate-limit.listing-archive.max-requests=1000000
conflux.rate-limit.listing-unsave.max-requests=1000000
conflux.rate-limit.connection-decision.max-requests=1000000
conflux.rate-limit.connection-withdraw.max-requests=1000000
conflux.rate-limit.profile-update.max-requests=1000000
conflux.rate-limit.admin-moderation.max-requests=1000000
