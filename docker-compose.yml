name: conflux

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: conflux
      MYSQL_USER: conflux
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set; run with --env-file backend/.env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set; run with --env-file backend/.env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -e 'SELECT 1' \"$$MYSQL_DATABASE\" > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/conflux
      DB_USERNAME: conflux
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set; run with --env-file backend/.env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set; run with --env-file backend/.env}
      JWT_ISSUER: ${JWT_ISSUER:-conflux}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-1h}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
